[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verantyx"
version = "0.7.4.dev0"
description = "A CLI for project decisions, evidence, and human learning"
readme = "docs/QUICKSTART.ja.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.25,<5", "cryptography>=41,<47", "psutil>=5.9,<8", "rich>=13.9,<15", "prompt-toolkit>=3.0.48,<4"]

[project.scripts]
verantyx = "verantyx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verantyx = ["locales/*.json", "schemas/*.json", "policies/*.cross"]
