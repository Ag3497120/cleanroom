name: Publish terminal to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Configure public compute endpoint
        env:
          COMPUTE_GATEWAY_URL: ${{ vars.COMPUTE_GATEWAY_URL }}
          ALLOW_UNCONFIGURED_COMPUTE: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/pages-config.mjs && node scripts/verify-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deploy
