name: Verify core and Cross runtime
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./core
      - run: cmake -S cross -B cross/build -DCMAKE_BUILD_TYPE=Release && cmake --build cross/build -j 2
      - run: python scripts/pin-cross-runtime.py
      - name: Verify responses, shared context and reusable assets
        working-directory: core
        env:
          PYTHONPATH: src:tests
          VERANTYX_PRECEDENT: ${{ github.workspace }}/execution
          VERANTYX_CROSS: ${{ github.workspace }}/cross/build/cross
        run: python -m unittest test_responses_v06 test_shared_context test_assets_v06 -v
      - run: python -m pip install -r requirements.txt
      - name: Verify compute routing and reservations
        run: python -m unittest discover -s tests/gateway -v
