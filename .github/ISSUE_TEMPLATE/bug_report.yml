name: Bug report
description: Report a reproducible problem with safe, minimal data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, personal notebooks or private project files. For vulnerabilities, read SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic data. Include the command or UI action.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cleanroom version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, terminal, Python and browser if relevant
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and scope
      description: What was checked? What is still unknown? State the model or fixture if relevant, without credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and private notebook or project contents.
          required: true
